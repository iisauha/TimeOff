<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Theme before first paint, and an iOS status bar that matches it:
  // dark draws the app under the status bar (white text); light keeps a white bar (dark text).
  (function () {
    var t = 'light';
    try { t = (JSON.parse(localStorage.getItem('nycdep.timeoff.v1')) || {}).theme || 'light'; } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = t;
    var m = document.createElement('meta'); m.name = 'apple-mobile-web-app-status-bar-style';
    m.content = dark ? 'black-translucent' : 'default'; document.head.appendChild(m);
    var c = document.createElement('meta'); c.name = 'theme-color'; c.id = 'themeColor';
    c.content = dark ? '#15191b' : '#f2f4f1'; document.head.appendChild(c);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DEP">
<title>NYC DEP Dashboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-v3.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  .page { padding-top: calc(var(--safe-t) + 24px); padding-bottom: calc(40px + var(--safe-b)); }
  .sub { color: var(--ink-2); margin: -8px 0 8px; font-size: 15px; }
  .row-sub b { font-weight: 600; }
  .a b { color: var(--annual); } .s b { color: var(--sick); }
  .badge-icon { border-radius: 10px; }
</style>
</head>
<body>
<main class="page">
  <h1 class="large-title">Dashboard</h1>
  <p class="sub">Personal tools</p>

  <h2 class="section-head">Tools</h2>
  <div class="list">
    <a class="row has-icon" href="timeoff/">
      <img class="badge-icon" src="icons/icon-v3.svg" alt="" width="32" height="32">
      <div class="row-main">
        <div class="row-title">Time Off</div>
        <div class="row-sub" id="toSub">Annual and sick leave</div>
      </div>
      <svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1 1l5.5 5.5L1 12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </a>
  </div>
</main>
<script src="timeoff/leave.js"></script>
<script>
  try {
    const S = Leave.load();
    if (S.setupDone || S.uses.length || S.rates.length) {
      const b = Leave.balanceOn(S, Leave.today());
      document.getElementById('toSub').innerHTML =
        `<span class="a"><b>${Leave.fmtDays(b.annual, S.dayMins)}</b> annual days</span> and <span class="s"><b>${Leave.fmtDays(b.sick, S.dayMins)}</b> sick</span>`;
    }
  } catch (e) {}
  if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !window.__reloaded) { window.__reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
